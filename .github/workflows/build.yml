name: Build payload
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld make unzip curl
      - name: Get SDK
        run: |
          curl -fsSL https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip -o sdk.zip
          sudo unzip -q sdk.zip -d /opt
          sudo chmod -R +x /opt/ps5-payload-sdk/bin
      - name: Build
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make -C payload
      - uses: actions/upload-artifact@v4
        with:
          name: Ps5Downloadly-elf
          path: payload/Ps5Downloadly.elf
