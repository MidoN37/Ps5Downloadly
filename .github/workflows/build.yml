name: Build PS5 FFPKG & ELF

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Tools & makefs
        run: |
          sudo apt-get update
          sudo apt-get install -y makefs bmake clang lld llvm curl git unzip

      - name: Setup Official PS5 Payload SDK
        run: |
          curl -sL https://github.com/ps5-payload-dev/sdk/releases/download/v0.45/ps5-payload-sdk.zip -o ps5-sdk.zip
          sudo unzip -q ps5-sdk.zip -d /opt
          sudo chmod -R +x /opt/ps5-payload-sdk/bin

      - name: Compile PS5 ELF & App Directory
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make all

      - name: Create ShadowMountPlus UFS2 PPSA99188.ffpkg
        run: |
          make ffpkg
          sha256sum dist/PPSA99188.ffpkg > dist/PPSA99188.ffpkg.sha256
          ls -lh dist/

      - name: Upload ShadowMountPlus FFPKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99188-ShadowMountPlus-FFPKG
          path: |
            dist/PPSA99188.ffpkg
            dist/PPSA99188.ffpkg.sha256
            dist/PPSA99188/
            dist/Ps5Downloadly.elf
